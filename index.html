<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>熊宝宝年度报告</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Press+Start+2P&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* A tap-through story, one full screen per page. Each illustrated page is a pixel-art scene
   whose plain sky holds the words; photo pages are pixel-framed collages on a gridded ground.
   Left half of the screen goes back, right half goes forward. Single light look on purpose. */
:root {
  --plum: #3B2A3F;
  --plum-2: #5E4B63;
  --paper: #FFFDF8;
  --coral: #E2675A;
  --violet: #7464E6;
  --butter: #F6E9BF;
  --backdrop: #E8E4F4;
  --head: "ZCOOL QingKe HuangYou", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --pix: "Press Start 2P", "Courier New", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--backdrop); color: var(--plum); font-family: var(--body); font-size: 16px; line-height: 1.6;
  display: grid; place-items: center; overflow: hidden; }
.phone { position: relative; width: 100%; height: 100%; overflow: hidden; background: #D2CFFB; user-select: none; -webkit-user-select: none; }
@media (min-width: 560px) { .phone { width: 420px; height: min(100% - 32px, 880px); border-radius: 28px; box-shadow: 0 30px 60px -20px rgba(59, 42, 63, .4); } }

/* pixel corners: a box with notched corners drawn by four hard shadows */
.px { background: var(--paper); box-shadow: 0 -3px 0 0 var(--plum), 0 3px 0 0 var(--plum), -3px 0 0 0 var(--plum), 3px 0 0 0 var(--plum), 0 7px 0 0 rgba(59, 42, 63, .25); }

/* progress + language */
.bar { position: absolute; z-index: 9; top: 0; left: 0; right: 0; display: flex; gap: 3px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.bar i { position: relative; flex: 1; height: 5px; background: rgba(59, 42, 63, .18); cursor: pointer; transition: transform .12s; }
.bar i::after { content: ""; position: absolute; inset: -12px -1px -12px -1px; }
.bar i:hover { transform: scaleY(1.8); }
.bar i.done { background: var(--plum); }
.lang { position: absolute; z-index: 10; top: calc(26px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  font: inherit; font-family: var(--pix); font-size: 11px; color: var(--plum); border: 0; padding: 7px 9px; cursor: pointer; }
.music { position: absolute; z-index: 10; top: calc(26px + env(safe-area-inset-top, 0px)); right: calc(max(16px, env(safe-area-inset-right, 0px)) + 50px);
  font: inherit; font-size: 15px; font-weight: 700; color: var(--plum); border: 0; padding: 4px 9px; cursor: pointer; line-height: 1.4; }
.music.off { opacity: .45; text-decoration: line-through; }
.music:focus-visible, .lang:focus-visible, .pbtn:focus-visible, .opt:focus-visible { outline: 3px solid var(--violet); outline-offset: 4px; }

/* slides */
.slide { position: absolute; inset: 0; overflow: hidden; opacity: 0; visibility: hidden; transform: scale(1.04); filter: blur(6px);
  transition: opacity .45s ease, transform .45s ease, filter .45s ease, visibility 0s .45s; background: var(--sky, #D2CFFB); }
.slide.on { opacity: 1; visibility: visible; transform: none; filter: none; transition: opacity .45s ease, transform .45s ease, filter .45s ease; }
.slide.back { transform: scale(.96); }
.stage { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; width: 100%; aspect-ratio: 572 / 1024; }
.stage > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.copy { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 8px;
  padding: calc(56px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) 0 max(22px, env(safe-area-inset-left, 0px)); }
/* on illustrated pages the words sit on their own pixel card so the scene never runs into them */
.slide:not(.photos) .copy { margin: calc(66px + env(safe-area-inset-top, 0px)) 14px 0; padding: 14px 16px 16px; background: rgba(255, 253, 248, .94);
  box-shadow: 0 -3px 0 0 var(--plum), 0 3px 0 0 var(--plum), -3px 0 0 0 var(--plum), 3px 0 0 0 var(--plum), 0 7px 0 0 rgba(59, 42, 63, .25); }
.dark .copy { color: var(--paper); }
.slide.dark .copy { background: rgba(43, 34, 62, .94); box-shadow: 0 -3px 0 0 var(--paper), 0 3px 0 0 var(--paper), -3px 0 0 0 var(--paper), 3px 0 0 0 var(--paper); }

.in { opacity: 0; }
.on .in { animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--d, 0) * 1s); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

.kick { font-size: 15px; font-weight: 700; color: var(--plum-2); }
.dark .kick { color: #D8D0F5; }
h1, h2 { font-family: var(--head); font-weight: 400; margin: 0; line-height: 1.2; letter-spacing: .02em; text-wrap: balance; }
h1 { font-size: 40px; }
h2 { font-size: 30px; }
[lang-en] h1, [lang-en] h2 { letter-spacing: 0; }
[lang-en] h1 { font-size: 30px; }
.say { font-size: 16px; line-height: 1.7; margin: 0; }
.num { font-family: var(--pix); line-height: 1.1; font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.big { font-family: var(--head); font-size: 62px; line-height: 1; }
.times { font-size: 15px; font-weight: 700; margin-left: 4px; }

/* buttons and bubbles */
.pbtn { font: inherit; font-weight: 700; font-size: 15px; color: var(--plum); border: 0; padding: 9px 16px; cursor: pointer; align-self: flex-start; transition: transform .1s; }
.pbtn:active { transform: translateY(3px); }
.pbtn.solid { background: var(--plum); color: var(--paper); box-shadow: 0 -3px 0 0 var(--plum), 0 3px 0 0 var(--plum), -3px 0 0 0 var(--plum), 3px 0 0 0 var(--plum), 0 7px 0 0 rgba(59, 42, 63, .25); }
.toast { font-size: 15px; font-weight: 700; color: var(--coral); min-height: 1.6em; margin: 0; }
.dark .toast { color: #FFC9A8; }
.bubble { position: absolute; z-index: 3; transform: translate(-50%, -100%); font: inherit; font-size: 15px; font-weight: 700; color: var(--plum);
  border: 0; padding: 8px 12px; max-width: 74%; width: max-content; text-align: center; line-height: 1.4; cursor: pointer; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; width: 10px; height: 9px; margin-left: -5px; background: var(--paper);
  box-shadow: -3px 0 0 0 var(--plum), 3px 0 0 0 var(--plum), 0 3px 0 0 var(--plum); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: translate(-50%, -100%) scale(1); } 50% { transform: translate(-50%, -100%) scale(1.08); } }
.hop { animation: hop .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes hop { 40% { transform: translate(-50%, -112%) scale(1.06); } }

.ripple { position: absolute; z-index: 8; pointer-events: none; width: 0; height: 0; }
.ripple i { position: absolute; width: 7px; height: 7px; margin: -3px; animation: burst .55s steps(5) forwards; }
@keyframes burst { to { transform: translate(var(--x), var(--y)); opacity: 0; } }

/* 哈哈 */
.haha-zone { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
.haha-zone span { position: absolute; bottom: -40px; font-family: var(--head); color: var(--plum); background: var(--paper); padding: 2px 10px; white-space: nowrap;
  box-shadow: 0 -2px 0 0 var(--plum), 0 2px 0 0 var(--plum), -2px 0 0 0 var(--plum), 2px 0 0 0 var(--plum); animation: float 4.6s linear forwards; }
.haha-zone span.boom { bottom: auto; animation: boom 1.2s ease-out forwards; }
@keyframes float { from { transform: translateY(0); opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } to { transform: translateY(-620px); opacity: 0; } }
@keyframes boom { from { transform: translate(0, 0) scale(.4); opacity: 1; } to { transform: translate(var(--x), var(--y)) scale(1.1); opacity: 0; } }

/* boss vs babe */
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; gap: 6px; }
.vs .w { font-family: var(--head); font-size: 22px; }
.vs .num { font-size: 26px; }
.vs .x { font-family: var(--pix); font-size: 12px; color: var(--plum-2); }

/* funnel */
.funnel { display: grid; gap: 5px; padding: 10px 12px; }
.funnel div { display: flex; justify-content: space-between; gap: 8px; padding: 4px 10px; font-size: 14px; font-weight: 700; color: var(--paper); margin: 0 auto; }
.funnel .f1 { width: 100%; background: #7E9CD6; } .funnel .f2 { width: 88%; background: #E3AE4A; color: var(--plum); } .funnel .f3 { width: 70%; background: var(--coral); justify-content: center; font-family: var(--pix); font-size: 13px; }

/* lucky coins */
.coin { position: absolute; z-index: 2; width: 14px; height: 14px; background: #F2C14E; pointer-events: none;
  box-shadow: inset -3px -3px 0 0 #C98F22, inset 3px 3px 0 0 #FFE59A, 0 0 0 2px #7A4E12; animation: fall 1.6s steps(12) forwards; }
.coin.env { width: 12px; height: 16px; background: #E2483C; box-shadow: inset 0 4px 0 0 #B7322A, 0 0 0 2px #6E1B16; }
@keyframes fall { from { transform: translateY(0) rotate(0); opacity: 1; } 80% { opacity: 1; } to { transform: translateY(var(--fall)) rotate(180deg); opacity: 0; } }

/* stamps */
.stamp { position: absolute; z-index: 3; pointer-events: none; font-family: var(--head); color: var(--coral); border: 4px solid var(--coral); border-radius: 50%;
  width: 78px; height: 78px; display: grid; place-items: center; font-size: 22px; opacity: .85; animation: stamp .28s steps(4) both; }
@keyframes stamp { from { transform: scale(2) rotate(var(--r)); opacity: 0; } to { transform: scale(1) rotate(var(--r)); opacity: .85; } }

/* photo pages */
.photos { --sky: #F4EEF9; background-color: var(--sky);
  background-image: linear-gradient(rgba(116, 100, 230, .07) 2px, transparent 2px), linear-gradient(90deg, rgba(116, 100, 230, .07) 2px, transparent 2px);
  background-size: 22px 22px; }
.photos.p2 { --sky: #EEF5F9; } .photos.p3 { --sky: #FBF1EA; } .photos.p4 { --sky: #F3F8EE; } .photos.p5 { --sky: #FBF6E6; }
.photos .copy { height: 100%; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
.stack { position: relative; flex: 1; min-height: 0; margin: 4px 0; cursor: pointer; }
.ph { position: absolute; inset: 0; margin: auto; width: fit-content; height: fit-content; padding: 7px 7px 0; background: var(--paper);
  box-shadow: 0 -3px 0 0 var(--plum), 0 3px 0 0 var(--plum), -3px 0 0 0 var(--plum), 3px 0 0 0 var(--plum), 0 8px 0 0 rgba(59, 42, 63, .22);
  transform: translate(var(--tx, 0), var(--ty, 0)) rotate(var(--r, 0deg)); transition: transform .55s cubic-bezier(.3, 1.3, .5, 1), opacity .4s; }
.ph img { display: block; max-width: var(--mw, 300px); max-height: var(--mh, 400px); width: auto; height: auto; pointer-events: none; }
.ph figcaption { font-size: 14px; font-weight: 700; line-height: 1.35; padding: 6px 2px 8px; text-align: center; max-width: var(--mw, 300px); }
.ph:not(:has(figcaption)) { padding-bottom: 7px; }
.ph.out { transform: translate(130%, -8%) rotate(18deg); opacity: 0; transition: transform .5s cubic-bezier(.5, 0, .7, .4), opacity .45s; }
.count { position: absolute; right: 0; bottom: -4px; z-index: 30; font-family: var(--pix); font-size: 11px; color: var(--plum); background: var(--paper); padding: 5px 7px;
  box-shadow: 0 -2px 0 0 var(--plum), 0 2px 0 0 var(--plum), -2px 0 0 0 var(--plum), 2px 0 0 0 var(--plum); }
.sticker { position: absolute; z-index: 3; width: 64px; height: auto; image-rendering: pixelated; pointer-events: none; }

/* quiz */
.lvl { font-size: 14px; font-weight: 700; color: var(--plum-2); }
.q { font-family: var(--head); font-size: 24px; line-height: 1.3; margin: 0; }
.opts { display: grid; gap: 12px; padding: 4px 3px 0; }
.opt { font: inherit; font-size: 15px; font-weight: 700; color: var(--plum); text-align: left; border: 0; padding: 10px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.opt::before { content: ""; width: 14px; height: 14px; flex: none; background: var(--paper); box-shadow: inset 0 0 0 3px var(--plum); }
.opt.yes { background: #E7E2FF; } .opt.yes::before { background: var(--violet); }
.opt.no { background: #FFE3DE; animation: shake .35s steps(4); }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
.fb { font-size: 15px; font-weight: 700; min-height: 1.6em; margin: 0; }
.fb.no { color: var(--coral); } .fb.yes { color: var(--violet); }

/* gift */
/* the code is never written on the page: Winnie fills the blanks from clues only she can answer */
.code-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 3px; margin: 2px 3px 0; }
.slot { display: grid; justify-items: center; gap: 3px; }
.slot small { font-family: var(--pix); font-size: 9px; color: var(--plum-2); }
.cell { width: 28px; height: 34px; border: 0; padding: 0; text-align: center; font-family: var(--pix); font-size: 14px; color: var(--plum); text-transform: uppercase; display: grid; place-items: center; }
input.cell { background: #EEE9FF; caret-color: var(--violet); }
input.cell:focus { outline: none; background: #FFF4C9; }
.cell.fixed { background: var(--paper); }
.dash { font-family: var(--pix); font-size: 14px; padding-bottom: 10px; }
.clues { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 3px; font-size: 14px; line-height: 1.45; }
.clues li { display: flex; gap: 8px; align-items: baseline; }
.clues b { font-family: var(--pix); font-size: 10px; color: var(--violet); flex: none; width: 14px; }
.note { font-size: 14px; color: var(--plum-2); margin: 0; }
.btnrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 4px; }

/* end */
.blown .stage > img { filter: brightness(.72) saturate(.9); transition: filter 1.2s; }
.sign { font-family: var(--head); font-size: 26px; margin: 0; }
.wish { display: grid; gap: 6px; }
.wish[hidden] { display: none; }

.navhint { font-size: 14px; font-weight: 700; color: var(--plum-2); }
.again-hint { position: absolute; z-index: 9; font-size: 14px; font-weight: 700; color: var(--plum); padding: 3px 8px; pointer-events: none; white-space: nowrap;
  transform: translate(-50%, -100%); animation: againup 1.6s ease-out forwards; }
@keyframes againup { 0% { opacity: 0; transform: translate(-50%, -70%); } 15% { opacity: 1; transform: translate(-50%, -100%); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -190%); } }
.on .stage > img { animation: drift 9s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes drift { to { transform: scale(1.04); } }
#confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7; }

@media (prefers-reduced-motion: reduce) {
  .slide { filter: none !important; transform: none !important; }
  .on .in, .pulse, .on .stage > img { animation: none !important; opacity: 1; }
  .ph { transition: none; }
  .haha-zone { display: none; }
}
@media (max-height: 700px) { h1 { font-size: 32px; } h2 { font-size: 25px; } .big { font-size: 48px; } .say { font-size: 15px; } .q { font-size: 21px; } .copy { gap: 6px; } }
</style>
<meta name="description" content="Winnie 的生日限定报告">
<style>[hidden]{display:none!important} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0}</style>

<body>

<div class="phone" id="phone">
  <div class="bar" id="bar"></div>
  <button class="lang px" id="lang" type="button" aria-label="切换语言 Switch language">EN</button>
  <button class="music px" id="music" type="button" aria-label="音乐开关 Music on or off">♪</button>

  <!-- P1 cover -->
  <section class="slide" style="--sky:#D2CFFB">
    <div class="stage"><img src="gen/cover.jpg" alt="戴墨镜和派对帽的小熊在生日派对房间里，兔子从旁边探头">
      <button class="bubble px pulse" id="cover-bubble" type="button" data-tap style="left:54%;top:64%" data-i="tapme"></button>
    </div>
    <div class="copy">
      <p class="kick in" style="--d:.05" data-i="p1k"></p>
      <h1 class="in" style="--d:.15" data-i="p1t"></h1>
      <p class="say in" style="--d:.3" data-i="p1s"></p>
      <div class="btnrow in" style="--d:.45"><button class="pbtn solid" type="button" data-go="next" data-i="start"></button><span class="navhint" data-i="navhint"></span></div>
    </div>

  <!-- P2 met -->
  <section class="slide" style="--sky:#D5E5F2">
    <div class="stage"><img src="gen/meet.jpg" alt="秋天的悉尼街角，小熊和兔子拿奶茶碰杯">
      <button class="bubble px pulse" id="cheers" type="button" data-tap style="left:50%;top:62%" data-i="cheersBtn"></button>
    </div>
    <div class="copy">
      <p class="kick in" style="--d:.05" data-i="p2k"></p>
      <h2 class="in" style="--d:.15" data-i="p2t"></h2>
      <p class="say in" style="--d:.3" data-i="p2s"></p>
    </div>
  </section>

  <!-- P3 days -->
  <section class="slide" style="--sky:#C9E5D5">
    <div class="stage"><img src="gen/path.jpg" alt="小熊和兔子手拉手走过一条经过烤肉、酒吧、婚纱店、海边、圣诞树、婚礼和球场的小路"></div>
    <div class="copy">
      <p class="kick in" style="--d:.05" data-i="p3k"></p>
      <div class="num in" style="--d:.15;font-size:40px" data-count="4200" data-suffix="+">4,200+</div>
      <h2 class="in" style="--d:.3" data-i="p3t"></h2>
      <p class="say in" style="--d:.45" data-i="p3s"></p>

  <!-- P4 words intro -->
  <section class="slide" style="--sky:#DDD9FD">
    <div class="stage"><img src="gen/phone.jpg" alt="小熊和兔子坐在一部巨大的手机上，周围飘满聊天气泡"></div>

      <h2 class="in" style="--d:.1" data-i="p4t"></h2>

  </section>

  <!-- P5 haha -->
  <section class="slide" style="--sky:#F2E9BE" data-haha>
    <div class="haha-zone" id="haha-zone"></div>

    <div class="copy">
      <p class="kick in" style="--d:.05" data-i="p5k"></p>
      <div class="row in" style="--d:.15"><span class="big" data-i="p5w"></span><span class="num" style="font-size:26px" data-count="3491">3,491</span><span class="times" data-i="times"></span></div>
      <p class="say in" style="--d:.3" data-i="p5s"></p>
      <button class="pbtn px in" style="--d:.45" type="button" id="haha-btn" data-i="p5b"></button>
      <p class="toast" id="haha-toast" aria-live="polite"></p>
    </div>
  </section>

  <!-- P6 buy -->
  <section class="slide" style="--sky:#FBD6BC">
    <div class="stage"><img src="gen/shop.jpg" alt="小熊和兔子提着一堆购物袋，空钱包长着翅膀飞走"></div>
    <div class="copy">
      <p class="kick in" style="--d:.05" data-i="p6k"></p>
      <div class="row in" style="--d:.15"><span class="big" data-i="p6w"></span><span class="num" style="font-size:26px" data-count="338">338</span><span class="times" data-i="times"></span></div>
      <p class="say in" style="--d:.3" data-i="p6s"></p>
      <button class="pbtn solid in" style="--d:.45" type="button" id="cart-btn" data-i="p6b"></button>
      <p class="toast" id="cart-toast" aria-live="polite"></p>
    </div>
  </section>

  <!-- P7 lol -->
  <section class="slide" style="--sky:#D5D4FB">
    <div class="stage" id="lucky-stage"><img src="gen/lucky.jpg" alt="小熊抱着金元宝笑到在空中打滚，金币和红包落下来，兔子拿红袋子接">
      <button class="bubble px pulse" id="angel" type="button" data-tap style="left:70%;top:47%" data-i="p7b"></button>
    </div>
    <div class="copy">
      <p class="kick in" style="--d:.05" data-i="p7k"></p>
      <div class="row in" style="--d:.15"><span class="big" data-i="p7w"></span><span class="num" style="font-size:26px" data-count="227">227</span><span class="times" data-i="times"></span></div>
      <p class="say in" style="--d:.3" data-i="p7s"></p>
    </div>
  </section>

  <!-- P8 boss vs babe -->
  <section class="slide" style="--sky:#D3E3F2">
    <div class="stage"><img src="gen/office.jpg" alt="上半部分小熊在办公桌前加班，下半部分小熊和兔子在爱心下拥抱"></div>
    <div class="copy">

  bgNext = actx.currentTime + .1; bgBus.gain.cancelScheduledValues(actx.currentTime); bgBus.gain.setTargetAtTime(.5, actx.currentTime, .4);
  scheduleBg(); bgTimer = setInterval(scheduleBg, 250);
}
function stopBg() { clearInterval(bgTimer); bgTimer = null; if (actx) bgBus.gain.setTargetAtTime(0, actx.currentTime, .3); }
let songBus = null;
function birthdaySong() {
  if (!musicOn || !audio()) return;
  stopBg(); songOn = true;
  if (songBus) songBus.disconnect();
  songBus = actx.createGain(); songBus.gain.value = .9; songBus.connect(master);
  const tune = [[67, .75], [67, .25], [69, 1], [67, 1], [72, 1], [71, 2], [67, .75], [67, .25], [69, 1], [67, 1], [74, 1], [72, 2],
    [67, .75], [67, .25], [79, 1], [76, 1], [72, 1], [71, 1], [69, 2], [77, .75], [77, .25], [76, 1], [72, 1], [74, 1], [72, 3]];
  const bass = { 2: 48, 5: 43, 9: 43, 11: 48, 14: 48, 17: 53, 21: 48, 23: 43, 24: 48 };
  const beat = 60 / 108; let t = actx.currentTime + .6;
  tune.forEach(([m, d], i) => { piano(m, t, Math.max(d * beat + .8, 1), .16, songBus, true); if (bass[i]) piano(bass[i], t, 2.2, .07, songBus); t += d * beat; });
  setTimeout(() => { if (songOn) { songOn = false; startMusic(); } }, (t - actx.currentTime + 1.5) * 1000);
}
function stopSong() { songOn = false; if (songBus && actx) songBus.gain.setTargetAtTime(0, actx.currentTime, .15); startMusic(); }
function paintMusic() { $("music").classList.toggle("off", !musicOn); }
$("music").addEventListener("click", () => {
  musicOn = !musicOn; try { localStorage.setItem("bb-music", musicOn ? "on" : "off"); } catch (e) {}
  paintMusic(); audio();
  if (actx) master.gain.setTargetAtTime(musicOn ? .9 : 0, actx.currentTime, .1);
  if (musicOn) { if (slides[cur].id === "end") birthdaySong(); else startMusic(); }
});
paintMusic();

/* open on the cover, or on #sN when a page is linked directly */
paint();
slides[0].classList.add("on"); bar.children[0].classList.add("done");
const m = /^#s(\d+)$/.exec(location.hash);
if (m) go(Math.min(+m[1], slides.length - 1), true);
</script>
